name: Build and Release

on:
  # Push a change to .github/release-tag on main to publish a release with that tag
  push:
    branches:
      - main
    paths:
      - ".github/release-tag"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.6.5-fork)"
        required: true

permissions:
  contents: write

jobs:
  build:
    # Only run in this fork, never in any other repository
    if: github.repository == 'GenesisOmniarch/UberWolf'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release x64)
        run: msbuild UberWolf.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag) -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if ([string]::IsNullOrEmpty($tag)) { $tag = (Get-Content ".github/release-tag" -Raw).Trim() }
          if ([string]::IsNullOrEmpty($tag)) { throw "No release tag specified" }
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $out = "build\x64\Release"
          $pkg = "package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$out\UberWolf.exe", "$out\UberWolfCli.exe", "README.md", "LICENSE" -Destination $pkg
          Compress-Archive -Path "$pkg\*" -DestinationPath "UberWolf-$tag-x64.zip" -Force
          Copy-Item "$out\UberWolf.exe", "$out\UberWolfCli.exe" -Destination .

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:TAG" `
            "UberWolf-$env:TAG-x64.zip" "UberWolf.exe" "UberWolfCli.exe" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "UberWolf $env:TAG (output directory fork)" `
            --notes-file ".github/release-notes.md"
